---
layout: default
title: "Contact Us"
description: "To contact us, please fill in the form hereinbelow and submit it. We will contact you back shortly."
---
<section class="page-content">
  <h1 class="page-title">Contact Us</h1>
  <p>To contact us, please fill in the form hereinbelow and submit it.</p>
  <p>We will contact you back shortly.</p>

  <form
    class="contact-form"
    id="contact-form"
    action="YOUR_FORM_ENDPOINT_HERE"
    method="POST"
    novalidate>
    <div id="form-error-summary" class="form-error-summary" role="alert" aria-live="assertive"></div>

    <!-- Redirect URL after successful submission (configured in Phase 5) -->
    <input type="hidden" name="_next" value="{{ '/contact_form_successful/' | absolute_url }}">
    <input type="hidden" name="redirect" value="{{ '/contact_form_successful/' | absolute_url }}">

    <!-- Honeypot anti-spam field -->
    <div class="hp-field" aria-hidden="true">
      <label for="website-field">Website</label>
      <input type="text" id="website-field" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <div class="form-group">
      <fieldset class="form-fieldset">
        <legend class="form-legend">Name <span class="required-star" aria-hidden="true">*</span></legend>
        <div class="name-row">
          <div class="name-col">
            <input
              type="text"
              id="first-name"
              name="first_name"
              class="form-control"
              autocomplete="given-name"
              required
              aria-required="true"
              aria-describedby="first-name-label first-name-error">
            <label for="first-name" id="first-name-label" class="sublabel">First</label>
            <span id="first-name-error" class="field-error-text" aria-live="polite"></span>
          </div>
          <div class="name-col">
            <input
              type="text"
              id="last-name"
              name="last_name"
              class="form-control"
              autocomplete="family-name"
              required
              aria-required="true"
              aria-describedby="last-name-label last-name-error">
            <label for="last-name" id="last-name-label" class="sublabel">Last</label>
            <span id="last-name-error" class="field-error-text" aria-live="polite"></span>
          </div>
        </div>
      </fieldset>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email <span class="required-star" aria-hidden="true">*</span></label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        autocomplete="email"
        required
        aria-required="true"
        aria-describedby="email-error">
      <span id="email-error" class="field-error-text" aria-live="polite"></span>
    </div>

    <div class="form-group">
      <label for="message" class="form-label">Comment or Message</label>
      <textarea
        id="message"
        name="message"
        rows="6"
        class="form-control"></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit</button>
  </form>
</section>
